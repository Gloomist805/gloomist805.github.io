            <h1 id="heading">一、从抖音开始</h1>
<p>今天刷抖音的时候偶然刷到这样一句话，好像是南京警察学院挂在墙上的：“<strong>想杀你的人今天就在行动了</strong>”。</p>
<p><img src="/post-images/1783950818212100200_0.jpg" alt="" /></p>
<p>我看到的第一反应是觉得有点搞笑。</p>
<p>虽然这句话的本意是鼓励人努力行动，但是用词显然有些过激了（虽然是警校）。于是达到了相当荒诞的效果。</p>
<p>继续想下去，从反内卷、反优&hellip;</p>
